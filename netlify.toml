# Only the site/ directory is ever deployed.
#
# This repository holds the original expense workbook, booking confirmations,
# raw extractions and working notes. None of that may reach a public URL.
# Netlify publishes site/ and nothing else, so anything outside it is private
# by default rather than by remembering to exclude it.
[build]
  publish  = "site"
  command  = "python3 build_site.py"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "no-referrer"
    X-Frame-Options        = "SAMEORIGIN"

# status.json is read cross-origin by the card on the portfolio site, so it
# needs an explicit allow. It is five public facts already on the front page,
# nothing that is not, and it is the only path opened up this way.
[[headers]]
  for = "/status.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control               = "public, max-age=300, must-revalidate"
